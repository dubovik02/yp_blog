[package]
name = "blog-client"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
prost = "0.14.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.5"

[build-dependencies]
tonic-prost-build = "0.14.5"
