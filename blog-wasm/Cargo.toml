[package]
name = "blog-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
js-sys = "0.3.95"
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
serde_json = { workspace = true }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
web-sys = {version = "0.3.95", features = [
  'Document',
  'Element',
  'HtmlElement',
  'Window',
  'Request',
  'RequestInit',
  'Response',
  'Headers',
  'console',
  'Storage'
]}

[lib]
crate-type = ["cdylib", "rlib"]



